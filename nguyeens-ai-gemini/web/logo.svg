<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 44" width="260" height="44" fill="none">
  <defs>
    <linearGradient id="bgGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#07150a"/>
      <stop offset="100%" stop-color="#030804"/>
    </linearGradient>
    <linearGradient id="borderGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#79ee87"/>
      <stop offset="100%" stop-color="#285430"/>
    </linearGradient>
  </defs>

  <!-- Box Emblem -->
  <g transform="translate(2, 2)">
    <rect x="0" y="0" width="40" height="40" rx="6" fill="url(#bgGlow)" stroke="url(#borderGlow)" stroke-width="2"/>
    <rect x="3" y="3" width="34" height="34" rx="4" fill="none" stroke="#173c1d" stroke-width="1"/>
    
    <!-- Stylized Geometric Letter N -->
    <path d="M 11 29 L 11 11 L 16.5 11 L 24.5 23.5 L 24.5 11 L 29 11 L 29 29 L 23.5 29 L 15.5 16.5 L 15.5 29 Z" fill="#a6ffae"/>
    
    <!-- Gemini Sparkle Star -->
    <path d="M 33 6 Q 33 9 36 9 Q 33 9 33 12 Q 33 9 30 9 Q 33 9 33 6 Z" fill="#79ee87"/>
  </g>

  <!-- Text: Nguyen's AI -->
  <text x="52" y="21" fill="#a6ffae" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="900" letter-spacing="-0.5">Nguyen's AI</text>

  <!-- Gemini Badge -->
  <g transform="translate(52, 26)">
    <rect x="0" y="0" width="108" height="15" rx="3" fill="#09180c" stroke="#285430" stroke-width="1"/>
    <circle cx="7" cy="7.5" r="2.5" fill="#79ee87"/>
    <text x="14" y="10.5" fill="#79ee87" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="8.5" font-weight="800" letter-spacing="1">GEMINI POWERED</text>
  </g>
</svg>
